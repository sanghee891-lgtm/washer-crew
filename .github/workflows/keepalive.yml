# 무료 Supabase 서버는 7일 동안 요청이 없으면 일시정지돼요.
# 매일 아침 서버에 작은 요청을 보내 깨어 있게 합니다(긴 연휴에도).
# 실패하면 GitHub이 저장소 주인에게 메일을 보내요.
name: keepalive

on:
  schedule:
    - cron: "17 21 * * *" # 매일 06:17 KST
  workflow_dispatch:

permissions:
  actions: write # 아래 '다시 켜기'에 필요

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_URL: https://ncsxszunxdetpwqnkjhq.supabase.co
          SB_KEY: sb_publishable_erElCPGFiyJrxseaq9Do6g_ybW0FtLB # 공개용 키(웹앱 config.js와 같음)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SB_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}')
            echo "try $i: HTTP $code $(cat /tmp/out)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep $((i * 30))
          done
          echo "::error::서버가 응답하지 않아요. Supabase 대시보드에서 일시정지됐는지 확인하세요."
          exit 1

      # 공개 저장소는 60일 동안 커밋이 없으면 GitHub이 예약 실행을 꺼 버려요. 매번 다시 켜 둡니다.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
