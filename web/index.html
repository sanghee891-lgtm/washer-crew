<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세탁기 크루</title>
<meta name="description" content="세탁기·건조기 세척과 이전설치 예약 및 월별 매출 장부">
<meta name="theme-color" content="#00419B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세탁기 크루">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 모바일은 상단(월·요약) + 카드 목록 + 하단 탭, PC(900px~)는 상단 탭 + 표 목록
   색: 세탁기 크루 로고의 네이비(#00419B)·밝은 파랑(#0693F8), 선 아이콘 + 둥근 모서리 */
:root {
  --bg: #f2f6fc;
  --surface: #ffffff;
  --surface-2: #e8f0fb;
  --ink: #0e1f3d;
  --ink-2: #3d4f70;
  --ink-3: #697a96;
  --line: #d5e0ef;
  --accent: #00419b;
  --accent-ink: #ffffff;
  --accent-soft: #e0ecfc;
  --brand-1: #00419b;
  --brand-2: #0693f8;
  --bar-plan: #7fc4fb;
  --good: #17784a;
  --good-soft: #dcf0e4;
  --warn: #a55300;
  --warn-soft: #fbe9d4;
  --bad: #bf3a33;
  --bad-soft: #f8dfdd;
  --shadow: 0 1px 2px rgba(0, 45, 110, .07), 0 3px 10px rgba(0, 45, 110, .05);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 18px;
  --tabs-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09111f; --surface: #111b2e; --surface-2: #1a2740; --ink: #e9effb; --ink-2: #a9b7d1; --ink-3: #7b8aa7;
    --line: #253452; --accent: #4fa6ff; --accent-ink: #03152e; --accent-soft: #14305a; --bar-plan: #1f5f9e;
    --brand-1: #9cc8ff; --brand-2: #36a8ff;
    --good: #4cc289; --good-soft: #133426; --warn: #f0a24f; --warn-soft: #3a2711; --bad: #ff7d74; --bad-soft: #3e1d1b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09111f; --surface: #111b2e; --surface-2: #1a2740; --ink: #e9effb; --ink-2: #a9b7d1; --ink-3: #7b8aa7;
  --line: #253452; --accent: #4fa6ff; --accent-ink: #03152e; --accent-soft: #14305a; --bar-plan: #1f5f9e;
  --brand-1: #9cc8ff; --brand-2: #36a8ff;
  --good: #4cc289; --good-soft: #133426; --warn: #f0a24f; --warn-soft: #3a2711; --bad: #ff7d74; --bad-soft: #3e1d1b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 84px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .amt { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }

/* ---------- 상단 ---------- */
/* 휴대폰: 상단은 스크롤과 함께 올라가 화면을 넓게 씀(날짜 머리만 고정). PC: 상단 고정 */
.top { position: relative; z-index: 20; background: var(--bg); }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 14px 8px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
.mark { flex: none; width: 44px; height: 44px; border-radius: 14px; background: #ffffff; border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; overflow: hidden; }
.mark img { width: 34px; height: auto; display: block; }
.word { font-weight: 800; font-size: 21px; letter-spacing: -.02em; color: var(--brand-1); white-space: nowrap; }
.word b { font-weight: 800; color: var(--brand-2); }
.about { display: flex; gap: 14px; align-items: center; }
.about img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid var(--line); background: #fff; flex: none; }
.about .t { font-weight: 800; font-size: 18px; color: var(--brand-1); }
.about .t b { color: var(--brand-2); }
.setup-logo { width: 120px; height: 120px; border-radius: 26px; border: 1px solid var(--line); background: #fff; justify-self: center; }
.empty .mk { display: block; width: 120px; margin: 0 auto 10px; opacity: .9; border-radius: 12px; }
.me-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.me-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.me-chip.none .dot { background: var(--warn); }
.month-row { display: flex; align-items: center; gap: 8px; padding-block: 4px 6px; flex-wrap: wrap; }
.month-nav { display: flex; align-items: center; gap: 2px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }
.month-label { font-size: 22px; font-weight: 800; min-width: 150px; text-align: center; letter-spacing: -.02em; }
.today-btn { height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.sum-strip { flex: 1 1 260px; min-width: 0; display: flex; gap: 6px; align-items: stretch; border: 0; background: none; padding: 0; text-align: left; }
.sum-strip .s { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.sum-strip .s small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
.sum-strip .s b { display: block; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum-strip .s.warn { background: var(--warn-soft); border-color: transparent; }
.sum-strip .s.warn b, .sum-strip .s.warn small { color: var(--warn); }

/* ---------- 탭 ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tab { height: var(--tabs-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 24; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 14px);
  height: 56px; padding: 0 22px 0 18px; border-radius: 28px; border: 0; background: var(--accent); color: var(--accent-ink);
  font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(0, 65, 155, .32); }
.fab svg { width: 22px; height: 22px; }

/* ---------- 공통 ---------- */
main { padding-block: 10px 24px; }
.banner { border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; font-size: 14px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { font-weight: 700; opacity: .8; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .chips { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; padding-bottom: 2px; }
.toolbar .chips::-webkit-scrollbar { display: none; }
.toolbar .chip { flex: none; padding: 0 12px; }
.search { flex: 1 1 200px; min-width: 0; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-2); background: var(--surface); border-radius: var(--r); border: 1px dashed var(--line); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.section-title { font-size: 16px; font-weight: 800; margin: 24px 2px 10px; }

/* ---------- 날짜 묶음 + 카드 ---------- */
.day { margin-bottom: 18px; }
.day-h { display: flex; align-items: baseline; gap: 8px; padding: 8px 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.day-h .d { font-weight: 800; font-size: 17px; }
.day-h .sun { color: var(--bad); }
.day-h .tag { font-size: 12px; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 1px 8px; border-radius: 999px; }
.day-h .meta { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); display: grid; grid-template-columns: 78px 1fr; cursor: pointer; overflow: hidden; }
.card:hover { border-color: var(--accent); }
.c-time { padding: 14px 0 14px 14px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid var(--line); }
.c-time b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.c-time span { font-size: 12.5px; color: var(--ink-3); }
.c-time .dur { margin-top: 4px; font-weight: 600; color: var(--ink-2); }
.c-main { padding: 12px 14px 14px; min-width: 0; display: grid; gap: 7px; }
.c-r1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.c-name { font-size: 18px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-amt { margin-left: auto; font-size: 18px; font-weight: 800; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.pill.scheduled { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.canceled { background: var(--surface-2); color: var(--ink-3); }
.pill.unpaid { background: var(--warn-soft); color: var(--warn); }
.pill.paid { background: var(--good-soft); color: var(--good); }
.c-items { font-weight: 600; color: var(--ink); }
.c-items .w { font-weight: 500; color: var(--ink-2); }
.c-links { display: flex; gap: 6px; flex-wrap: wrap; }
.lk { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 11px; border-radius: 10px; background: var(--surface-2); border: 0; font-size: 14px; color: var(--ink); text-decoration: none; max-width: 100%; }
.lk svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
.lk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-pay { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.c-crew { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.who { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.who.me { background: var(--accent); color: var(--accent-ink); }
.who.maybe { background: var(--warn-soft); color: var(--warn); }
.who.no { background: var(--surface-2); color: var(--ink-3); text-decoration: line-through; }
.c-rsvp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rs { min-height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; color: var(--ink-2); }
.rs-yes[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rs-no[aria-pressed="true"] { background: var(--ink-3); border-color: var(--ink-3); color: var(--surface); }
.rs-maybe[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pill.new { background: var(--bad); color: #fff; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; display: grid; gap: 8px; }
.notice-h { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--ink); }
.notice-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.notice-list .notice { border: 0; border-radius: 0; margin: 0; background: none; position: relative; }
.notice-list .notice + .notice::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; border-top: 1px solid var(--line); }
.notice-acts { display: flex; gap: 8px; justify-content: flex-end; }
.nt-ic { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.nt-ic svg { width: 20px; height: 20px; }
.notice-row { text-align: left; border: 0; background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 600; color: var(--ink); }
.need { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.need.short { color: var(--warn); }
.c-act { margin-left: auto; display: flex; gap: 6px; }
.btn { min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.c-warn { font-size: 13px; font-weight: 600; color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 5px 8px; }
.card.st-canceled { opacity: .6; }
.card.st-canceled .c-name, .card.st-canceled .c-amt { text-decoration: line-through; }
.card.st-done .c-time { background: var(--good-soft); }

/* PC 표 */
.tbl-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: var(--surface-2); }
.tbl tr.dayrow td { background: var(--bg); font-weight: 700; padding: 8px 10px; }
.tbl tr.st-canceled td { color: var(--ink-3); text-decoration: line-through; }
.tbl .r { text-align: right; }
.tbl .nowrap { white-space: nowrap; }
.tbl .sub { display: block; font-size: 12.5px; color: var(--ink-3); }
.tbl td { word-break: keep-all; }
.tbl .who { white-space: nowrap; }
.tbl .cust { min-width: 120px; }
.tbl .cust .lk { margin-top: 4px; }
.tbl .addr-box { max-width: 320px; min-width: 180px; }
.tbl .it + .it { margin-top: 6px; }
.tbl .it b { display: block; white-space: nowrap; }
.tbl .it .sub { white-space: nowrap; }
.tbl td.acts { width: 1%; }
.tbl .c-rsvp { display: flex; gap: 4px; min-width: 0; margin-bottom: 6px; }
.tbl .rs { min-height: 36px; padding: 0 12px; font-size: 14px; white-space: nowrap; }

/* ---------- 달력 ---------- */
.cal { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-head div { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 8px 0; background: var(--surface-2); }
.cal-head div:first-child { color: var(--bad); }
.cell { min-height: 68px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 5px; text-align: left; background: none; border-right: 0; border-bottom: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell:nth-child(7n+1) { border-left: 0; }
.cell .dn { font-size: 14px; font-weight: 600; }
.cell.sun .dn { color: var(--bad); }
.cell.today .dn { background: var(--accent); color: var(--accent-ink); border-radius: 999px; width: 24px; height: 24px; display: grid; place-items: center; }
.cell.sel { background: var(--accent-soft); }
.cell .cnt { font-size: 12px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 5px; align-self: flex-start; }
.cell .won { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.blank { background: var(--bg); cursor: default; }

/* ---------- 통계 ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); padding: 14px 16px; min-width: 0; }
.tile small { display: block; color: var(--ink-3); font-weight: 600; font-size: 13px; }
.tile .big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .big .u { font-size: 15px; font-weight: 600; margin-left: 2px; }
.tile .sub { font-size: 13px; color: var(--ink-2); }
.tile.warn { background: var(--warn-soft); border-color: transparent; }
.tile.warn small, .tile.warn .big { color: var(--warn); }
.panel { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); padding: 14px 16px; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: 76px 1fr 56px; gap: 8px; align-items: center; font-size: 14px; }
.hbar .lab { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .track, .hbar .fill { display: block; }
.hbar .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.hbar .val { text-align: right; font-weight: 700; }
.grid2 { display: grid; gap: 8px; grid-template-columns: 1fr; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; }
.chart-box text { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.chart-box text.cur { fill: var(--ink); font-weight: 700; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); line-height: 1.4; }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 0; }

/* ---------- 설정 ---------- */
.staff-edit { display: grid; gap: 8px; }
.staff-edit .row { display: flex; gap: 8px; }
.inp { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; width: 100%; min-width: 0; }
textarea.inp { height: auto; min-height: 72px; padding: 10px 12px; resize: vertical; }
.help { font-size: 14px; color: var(--ink-2); line-height: 1.6; }
.help li { margin-bottom: 4px; }

/* ---------- 입력 시트 ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(8, 16, 22, .45); display: flex; justify-content: center; align-items: flex-end; }
.sheet-in { background: var(--bg); width: 100%; max-width: 680px; height: 100%; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); }
.sheet-in > .wrap { width: 100%; max-width: none; margin: 0; }
.sheet-h { display: flex; align-items: center; gap: 8px; padding-block: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-size: 18px; margin: 0; flex: 1; }
.sheet-b { flex: 1; overflow-y: auto; padding-block: 12px 24px; -webkit-overflow-scrolling: touch; }
.sheet-f { display: flex; gap: 8px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.sheet-f .btn { min-height: 50px; font-size: 16px; }
.sheet-f .grow { flex: 1; }
.fs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 10px; display: grid; gap: 10px; }
.fs > h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; }
.f { display: grid; gap: 5px; min-width: 0; }
.f > label, .f > .lab { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.endinfo { font-size: 14px; color: var(--ink-2); }
.endinfo b { color: var(--ink); }
.item { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; border-radius: 10px; background: var(--surface-2); }
.item .full { grid-column: 1 / -1; }
.item select, .item input { height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; width: 100%; min-width: 0; }
.qty { display: flex; align-items: center; gap: 4px; }
.qty button { width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; flex: none; }
.qty input { text-align: center; font-weight: 700; }
.item .rm { justify-self: end; }
.won-inp { position: relative; }
.won-inp input { font-size: 20px; font-weight: 700; text-align: right; padding-right: 36px; height: 50px; }
.won-inp span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; }
.toggle input { width: 24px; height: 24px; accent-color: var(--good); }
.hist { background: var(--accent-soft); border-radius: 10px; padding: 10px; font-size: 13.5px; display: grid; gap: 4px; }
.hist ul { margin: 0; padding-left: 18px; }
.conflict { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; }
.stale { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 600; }
details.fs > summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; }
details.fs > summary::-webkit-details-marker { display: none; }
details.fs > summary::after { content: "펼치기"; font-size: 13px; color: var(--accent); }
details.fs[open] > summary::after { content: "접기"; }
.meta-line { font-size: 12.5px; color: var(--ink-3); text-align: center; }

/* ---------- 모달·토스트 ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 16, 22, .5); display: grid; place-items: end center; }
.modal-in { background: var(--surface); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-height: 90%; overflow-y: auto; }
.modal-in h2 { margin: 0; font-size: 19px; text-wrap: balance; }
.modal-in p { margin: 0; color: var(--ink-2); }
.big-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.big-choices .btn { min-height: 56px; font-size: 17px; }
.modal-in .btn.wide { min-height: 50px; font-size: 16px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
a.btn { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.modal-in .btn.nav-main { min-height: 60px; font-size: 18px; }
.nav-more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.nav-more .btn.wide { min-height: 46px; font-size: 14px; padding: 0 6px; white-space: normal; line-height: 1.25; text-align: center; }
.nav-web { display: flex; gap: 16px; justify-content: center; }
/* 작업 사진 */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.modal-in.photo-modal { max-width: 640px; }
.ph-sec { display: grid; gap: 8px; }
.ph-h { font-weight: 700; font-size: 15px; }
.ph-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ph { aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); padding: 0; position: relative; display: block; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph img.broken { opacity: 0; }
.ph.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; }
.ph.add svg { width: 26px; height: 26px; }
.ph.add span { text-align: center; line-height: 1.25; }
.ph.pending img { opacity: .55; }
.ph.pending span { position: absolute; inset: auto 0 0 0; background: rgba(0, 30, 70, .7); color: #fff; font-size: 12px; font-weight: 700; text-align: center; padding: 3px 0; }
.ph.pending.failed span { background: var(--bad); }
.pv-top { display: flex; align-items: center; gap: 12px; }
.pv-img { background: #0b1220; border-radius: 12px; overflow: hidden; display: grid; place-items: center; min-height: 200px; }
.pv-img img { max-width: 100%; max-height: 62vh; display: block; }
.pv-meta { margin: 0; font-size: 13px; }
.pv-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.pv-nav .btn { min-height: 46px; flex: 1; }
.pv-del { display: flex; gap: 8px; flex: 2; }
/* 이전설치 출발/도착 */
.lk em { font-style: normal; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 5px; flex: none; }
.lk .tag-from { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.lk .tag-to { background: var(--accent); color: var(--accent-ink); }
.move { display: grid; gap: 10px; padding: 10px; border-radius: 10px; background: var(--accent-soft); }
.sel-text { user-select: all; font-size: 18px; font-weight: 700; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; word-break: break-all; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-weight: 600; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast button { background: none; border: 0; color: var(--bar-plan); font-weight: 700; padding: 4px; white-space: nowrap; flex: none; }

@media (min-width: 640px) {
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: 1fr 1fr; }
  .sheet { align-items: center; }
  .sheet-in { height: 92%; border-radius: 16px; overflow: hidden; padding-top: 0; }
  .modal { place-items: center; }
  .modal-in { border-radius: 16px; }
}
/* PC 표: 1280px보다 좁으면 참여·불참·보류를 세로로 쌓아 폭을 줄임 */
@media (max-width: 1279px) {
  .tbl .c-rsvp { flex-direction: column; }
  .tbl .rs { min-height: 32px; }
  .tbl .addr-box { min-width: 150px; }
}
@media (min-width: 900px) {
  .cards { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); align-items: start; }
  body { padding-bottom: 32px; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); }
  .day-h { top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 112px)); }
  .toolbar .chips { flex-wrap: wrap; }
  .tabs { position: static; display: flex; gap: 4px; border: 0; padding: 0; background: none; }
  .tab { height: 40px; flex-direction: row; gap: 6px; padding: 0 14px; border-radius: 10px; font-size: 14.5px; }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-current="page"] { background: var(--accent-soft); }
  .fab { position: static; height: 42px; padding: 0 16px; font-size: 15px; box-shadow: none; }
  .fab svg { width: 18px; height: 18px; }
  .toast { bottom: 24px; }
  .cell { min-height: 92px; }
}
/* 로그인(사용자 고르기 + 비밀번호 6자리) */
.need-login #app { display: none; }
#login { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; display: grid; place-items: start center; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.login-in { width: 100%; max-width: 480px; display: grid; gap: 20px; }
.login-brand { display: grid; justify-items: center; gap: 4px; text-align: center; }
.login-mark { width: 76px; height: 76px; border-radius: 22px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; margin-bottom: 8px; }
.login-mark img { width: 56px; height: auto; }
.login-title { font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: var(--brand-1); }
.login-title b { color: var(--brand-2); font-weight: 800; }
.login-sub { font-size: 15px; color: var(--ink-3); }
.login-head h1 { margin: 0; font-size: 24px; font-weight: 800; word-break: keep-all; text-wrap: balance; }
.login-head p { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.login-list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.login-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; border: 0; background: none; text-align: left; position: relative; }
.login-row + .login-row::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; border-top: 1px solid var(--line); }
.login-row:active { background: var(--surface-2); }
.lr-av { width: 50px; height: 50px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.lr-av.owner { background: var(--accent-soft); color: var(--accent); }
.lr-av svg { width: 24px; height: 24px; }
.lr-av.big { width: 64px; height: 64px; }
.lr-av.big svg { width: 30px; height: 30px; }
.lr-name { flex: 1; display: grid; gap: 2px; min-width: 0; }
.lr-name b { font-size: 18px; }
.lr-name small, .login-who small { font-size: 14px; color: var(--ink-3); }
.lr-chev { color: var(--ink-3); display: grid; }
.lr-chev svg { width: 22px; height: 22px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 10px; display: grid; gap: 10px; text-align: center; }
.login-back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: 15px; }
.login-back svg { width: 18px; height: 18px; }
.login-who { display: grid; justify-items: center; gap: 4px; }
.login-who b { font-size: 22px; }
.login-ask { margin: 0; font-size: 16px; color: var(--ink-2); }
.login-wait { text-align: center; }
.login-foot { text-align: center; font-size: 12px; letter-spacing: .12em; color: var(--ink-3); padding-top: 4px; }
.login-err { margin: 0; color: var(--bad) !important; font-weight: 700; min-height: 1.4em; }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 6px 0; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); }
.pin-dots i.on { background: var(--accent); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pin-pad .btn { min-height: 56px; font-size: 26px; }
.pin-pad [data-del] { font-size: 16px; }
.pin-inp { height: 56px; font-size: 26px; letter-spacing: .4em; text-align: center; }

/* 고객 요청·확인 문자·알림 */
.notice.req .nt-ic { background: var(--good-soft); color: var(--good); }
.notice.remind .nt-ic { background: var(--warn-soft); color: var(--warn); }
.notice-h b { margin-right: auto; }
.notice-line { font-size: 14px; color: var(--ink-2); padding-left: 50px; }
.req-card { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 4px; font-size: 15px; }
.req-card.sent { background: var(--surface-2); }
.req-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.req-h a { color: var(--accent); font-weight: 700; }

.req-acts { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.req-acts .btn { min-height: 46px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.req-acts .grow { flex: 1; }
.req-card .tag-from, .req-card .tag-to { font-style: normal; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 5px; }

.req-card .tag-to { background: var(--accent); color: var(--accent-ink); }
.sms-text { background: var(--accent-soft); border-radius: 10px; padding: 10px; font-size: 14.5px; }
.acct-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--line); }
.acct-row:last-of-type { border-bottom: 0; }
.acct-row .muted { margin-right: auto; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) {
  .card, .chip, .btn, .tab { transition: background-color .12s, border-color .12s, color .12s; }
}
