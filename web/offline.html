<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00419B">
<title>세탁기 크루</title>
<style>
:root { --bg: #f2f6fc; --surface: #ffffff; --ink: #0e1f3d; --ink-2: #3d4f70; --line: #d5e0ef; --accent: #00419b; --accent-ink: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #09111f; --surface: #111b2e; --ink: #e9effb; --ink-2: #a9b7d1; --line: #253452; --accent: #4fa6ff; --accent-ink: #03152e; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.box { max-width: 360px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; text-align: center; display: grid; gap: 10px; }
h1 { margin: 0; font-size: 21px; }
p { margin: 0; color: var(--ink-2); line-height: 1.6; }
button { margin-top: 8px; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<div class="box">
  <h1>인터넷에 연결되지 않았어요</h1>
  <p>와이파이나 데이터가 켜져 있는지 확인한 뒤<br>아래 버튼을 눌러 주세요.</p>
  <button type="button" onclick="location.reload()">다시 열기</button>
</div>
</body>
</html>
